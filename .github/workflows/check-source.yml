name: Check results source

# Run this by hand any time to confirm GitHub can reach the Elections Committee.
# It downloads the current files and prints a summary. Nothing is published.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p /tmp/out && python scripts/fetch_results.py --out /tmp/out && ls -la /tmp/out
