name: Probe Weinbren
on:
  push:
    branches: [wbprobe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Download
        run: |
          mkdir -p out raw
          B=https://israel.weinbren.me/live
          UA='Mozilla/5.0 (compatible; GlobeInBriefElectionWatcher/1.0; +https://johnnoto.github.io/israel-election-watcher/)'
          curl -sS -m 30 -A "$UA" -o raw/status.json "$B/status.json?_=$(date +%s)"
          vc=$(python3 -c "import json;print(json.load(open('raw/status.json'))['files']['expc.csv'])"); vb=$(python3 -c "import json;print(json.load(open('raw/status.json'))['files']['expb.csv'])")
          curl -sS -m 120 -A "$UA" -o raw/expc.csv -w 'expc %{http_code} %{size_download}\n' "$B/expc.csv?v=$vc" > out/log.txt
          curl -sS -m 180 -A "$UA" -o raw/expb.csv -w 'expb %{http_code} %{size_download}\n' "$B/expb.csv?v=$vb" >> out/log.txt
          wc -l raw/*.csv >> out/log.txt
          head -c 800 raw/expc.csv > out/expc_head.txt; head -c 800 raw/expb.csv > out/expb_head.txt
          grep -c 'סמל ישוב' raw/expc.csv raw/expb.csv >> out/log.txt || true
          cd repo && python3 scripts/fetch_results.py --local ../raw --guard --out /tmp >> ../out/log.txt 2>&1 || echo "converter exit $?" >> ../out/log.txt
      - name: Save
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
