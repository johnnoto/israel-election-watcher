name: Probe Weinbren
on:
  push:
    branches: [wbprobe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p out && cd out
          B=https://israel.weinbren.me/live
          UA='Mozilla/5.0 (compatible; GlobeInBriefElectionWatcher/1.0; +https://johnnoto.github.io/israel-election-watcher/)'
          curl -sS -m 30 -A "$UA" -o status.json "$B/status.json?_=$(date +%s)"
          v=$(python3 -c "import json;print(json.load(open('status.json'))['files']['municipal_data.json'])")
          curl -sS -m 120 -A "$UA" -o m.json "$B/municipal_data.json?v=$v"
          python3 - > log.txt <<'PY'
          import json
          m = json.load(open('m.json')); P = set(m['parties'])
          print('top keys', list(m.keys())); print('totals', m['totals'])
          f = next(iter(m['features'].values()))
          print('extra keys', [k for k in f if k not in P])
          ks = [k for k in f if k not in P and k not in ('שם ישוב',)]
          for k in ks:
              vals = [x.get(k) for x in m['features'].values()]
              print(k, 'sum', sum(v for v in vals if isinstance(v, (int, float))), 'sample', vals[:5])
          PY
          rm -f m.json
      - name: Save
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
