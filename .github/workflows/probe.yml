name: Probe Weinbren
on:
  push:
    branches: [wbprobe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p out && cd out
          UA='Mozilla/5.0 (compatible; GlobeInBriefElectionWatcher/1.0; +https://johnnoto.github.io/israel-election-watcher/)'
          date -u > log.txt
          curl -sS -m 30 -A "$UA" "https://israel.weinbren.me/live/status.json?_=$(date +%s)" >> log.txt; echo >> log.txt
          curl -sS -m 30 -A "$UA" -o reuters.html -w 'reuters %{http_code} %{size_download}\n' https://www.reuters.com/graphics/ISRAEL-ELECTION/RESULTS/akvelybkapr/ >> log.txt
          curl -sS -m 30 -A "$UA" -o r_robots.txt -w 'reuters robots %{http_code}\n' https://www.reuters.com/robots.txt >> log.txt
          grep -oE '"[^"]*\.json[^"]*"' reuters.html | sort -u | head -30 >> log.txt
      - name: Save
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
