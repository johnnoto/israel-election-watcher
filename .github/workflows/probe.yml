name: Probe Weinbren
on:
  push:
    branches: [wbprobe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p out && cd out
          B=https://israel.weinbren.me/live
          UA='Mozilla/5.0 (compatible; GlobeInBriefElectionWatcher/1.0; +https://johnnoto.github.io/israel-election-watcher/)'
          curl -sS -m 30 -A "$UA" -o status.json -w 'status %{http_code}\n' "$B/status.json" | tee log.txt
          cat status.json >> log.txt; echo >> log.txt
          for f in expc.csv expb.csv night.json; do
            v=$(python3 -c "import json;print(json.load(open('status.json')).get('files',{}).get('$f',''))")
            curl -sS -m 90 -A "$UA" -o $f -w "$f v=$v %{http_code} %{size_download}\n" "$B/$f?v=$v" | tee -a log.txt
          done
          head -c 1500 expc.csv > expc_head.txt; head -c 1500 expb.csv > expb_head.txt; head -c 1500 night.json > night_head.txt
          wc -l expc.csv expb.csv >> log.txt
          rm -f expc.csv expb.csv night.json
      - name: Save
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
