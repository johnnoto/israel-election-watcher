name: Probe Weinbren
on:
  push:
    branches: [wbprobe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p out && cd out
          B=https://israel.weinbren.me
          UA='Mozilla/5.0 (compatible; GlobeInBriefElectionWatcher/1.0)'
          curl -sS -m 40 -A "$UA" -o index.html -w 'index %{http_code} %{size_download}\n' $B/ | tee log.txt
          curl -sS -m 20 -A "$UA" -o robots.txt -w 'robots %{http_code}\n' $B/robots.txt | tee -a log.txt
          for p in $(grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' index.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u | head -20); do
            case "$p" in http*) u="$p";; /*) u="$B$p";; *) u="$B/$p";; esac
            f=$(echo "$p" | tr '/?=&' '____' | cut -c1-80)
            curl -sS -m 40 -A "$UA" -o "asset_$f" -w "$u %{http_code} %{size_download}\n" "$u" | tee -a log.txt
          done
          cat asset_* index.html 2>/dev/null | grep -oE '["'"'"'`][^"'"'"'` ]*(\.json|\.csv|/api/[^"'"'"'` ]*|bechirot[^"'"'"'` ]*)[^"'"'"'` ]*["'"'"'`]' | sort -u | head -80 > urls.txt
          grep -oiE '.{0,120}(source|bechirot|committee|licen|terms|github|copyright).{0,120}' index.html asset_* 2>/dev/null | head -60 > mentions.txt
          ls -la >> log.txt
      - name: Save
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
